[project]
name = "ArtRT"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "av>=15.1.0,<18",
    "matplotlib>=3.10",
    "psutil>=7.2",
    "loguru>=0.7",
    "pytest>=9.1",
    "ruff>=0.4",
    "mamba-ssm>=2.0.0",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "causal-conv1d>=1.6.2.post1",
]

[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
