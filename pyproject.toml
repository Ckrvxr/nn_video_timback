[project]
name = "ArtRT"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jax[cuda12]==0.6.0",
    "flax>=0.10.0",
    "optax>=0.2.0",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "av>=15.1.0,<18",
    "matplotlib>=3.10",
    "psutil>=7.2",
    "loguru>=0.7",
    "pytest>=9.1",
    "ruff>=0.4",
    "flaxmodels>=0.1.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
