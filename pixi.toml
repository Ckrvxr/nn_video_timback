[workspace]
authors = ["Ckrvxr"]
channels = ["conda-forge"]
name = "video_timback"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[system-requirements]
cuda = "12"

[dependencies]
python = ">=3.11,<3.13"
numpy = "*"
opencv = "*"
pillow = "*"
scipy = "*"
ffmpeg = "*"
tensorboard = "*"
pyyaml = "*"
tqdm = "*"
h5py = "*"
scikit-image = "*"

[pypi-dependencies]
wandb = "*"
lpips = "*"
onnx = "*"
huggingface-hub = "*"

[target.osx-arm64.dependencies]
pytorch = "*"
torchvision = "*"

[target.linux-64.dependencies]
pytorch-gpu = "*"
torchvision = "*"
cuda-version = "12.6.*"
svt-av1 = "*"

[target.win-64.dependencies]
pytorch-gpu = "*"
torchvision = "*"
cuda-version = "12.6.*"
svt-av1 = "*"

[target.win-64.pypi-dependencies]
onnxruntime-gpu = ">=1.26.0, <2"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
ipython = "*"
jupyter = "*"

[tasks]

# ═══════════════════════════════════════════
#  🧪 Test — 快速迭代测试
# ═══════════════════════════════════════════
test-train = "python train.py --config configs/test.yaml"
test-val   = "python scripts/run_validate.py --config configs/test.yaml --video data/raw_videos/test_clip_1.mp4 --checkpoint checkpoints/test/best.pth --crf 40 --preset 10 --output output/validate/val_test.mp4 --tile-size 960 --tile-overlap 0 --scale 1"

# ═══════════════════════════════════════════
#  🏭 Prod — 生产训练与验证
# ═══════════════════════════════════════════
prod-train = "python train.py --config configs/prod.yaml"
prod-val   = "python scripts/run_validate.py --config configs/prod.yaml --video data/raw_videos/test_clip_1.mp4 --checkpoint checkpoints/prod/best.pth --crf 40 --preset 10 --output output/validate/val_prod.mp4 --tile-size 960 --tile-overlap 0 --scale 1"

# ═══════════════════════════════════════════
#  🛠  Tools — 数据生成、lint、测试
# ═══════════════════════════════════════════
gen-data         = "python data/generate_pairs.py --config configs/default.yaml"
gen-data-svt     = "python data/generate_pairs.py --encoder svt"
gen-data-aom     = "python data/generate_pairs.py --encoder aom"
prepare-realisvideo = "python scripts/prepare_realisvideo.py --max-frames 100 --workers 2"
lint         = "ruff check ."
test-all     = "pytest tests/ -v"

# ═══════════════════════════════════════════
#  🚀  Inference — 推理与导出
# ═══════════════════════════════════════════
infer       = "python inference.py --input video.mp4 --output out.mp4 --scale 4"
infer-1x    = "python inference.py --input video.mp4 --output out.mp4 --scale 1"
export-onnx = "python scripts/export_onnx.py --checkpoint ckpt.pth --scale 4"


[environments]
default = { solve-group = "prod" }
dev = { features = ["dev"], solve-group = "prod" }
