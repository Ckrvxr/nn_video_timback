[workspace]
authors = ["Ckrvxr"]
channels = ["conda-forge"]
name = "hyperfixer"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[system-requirements]
cuda = "12"

[dependencies]
python = ">=3.11,<3.13"
numpy = "*"
opencv = "*"
ffmpeg = "*"
pyyaml = "*"
tqdm = "*"
av = ">=15.1.0,<18"
python-blosc = ">=1.11.4,<2"

[pypi-dependencies]
loguru = "*"

[target.osx-arm64.dependencies]
pytorch = "*"
torchvision = "*"

[target.linux-64.dependencies]
pytorch-gpu = "*"
torchvision = "*"
cuda-version = "12.6.*"
svt-av1 = "*"

[target.win-64.dependencies]
pytorch-gpu = "*"
torchvision = "*"
cuda-version = "12.6.*"
svt-av1 = "*"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
ipython = "*"
jupyter = "*"

[tasks]

# ═══════════════════════════════════════════
#  🧪 Test — 快速迭代测试
# ═══════════════════════════════════════════
test-train = "python scripts/train.py --config configs/test.yaml"
# ═══════════════════════════════════════════
#  🏭 Prod — 生产训练
# ═══════════════════════════════════════════
prod-train = "python train.py --config configs/prod.yaml"

# ═══════════════════════════════════════════
#  🛠  Tools — 数据集生成、lint、测试
# ═══════════════════════════════════════════
gen-dataset  = "python scripts/generate_dataset.py -i data/raw_videos"
lint         = "ruff check ."
test-all     = "pytest tests/ -v"



[environments]
default = { solve-group = "prod" }
dev = { features = ["dev"], solve-group = "prod" }
