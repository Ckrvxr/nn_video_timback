---
# Model architecture parameters

model:
  # HyperFixer — scale-less 4K de-artifact
  name: hyper_fixer
  n_features: 48
  n_blocks: 2
  latent: 512

  # Components
  frame_feature:
    in_ch: 48
    out_ch: 32

  temporal_fusion:
    in_channels: 96       # 32 × 3

  hyper_block:
    enabled: true
    latent: 512

  backbone:
    type: hfb              # Hardware-Friendly Block: DW→SiLU→PW + skip

  sca:
    enabled: true
    reduction: 8

  global_residual:
    enabled: true

  recon:
    in_channels: 48
    kernel_size: 3
