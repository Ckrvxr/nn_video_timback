output_directory: runs/mamba
random_seed: 42

dataset:
  data_type: preprocessed
  dataset_paths: [
             ./data/violet
    ]
  val_dataset_path: ./data/violet_val
  patch_size: 512
  num_frames: 9
  sequential_mode: true
  validation_batch_size: 2
  num_workers: 1
  validation_num_workers: 0
  shuffle_variants: true
  clip_repeat_factor: 1

model_architecture:
  model_name: mamba_fixer
  num_features: 64
  state_dimension: 32
  num_features_stream: 2
  num_experts: 100
  n_active: 2
  dilation_rates: [1, 2, 4, 32]
  routing_threshold: 0.90

training_settings:
  batch_size: 1
  num_epochs: 20
  learning_rate: 5.0e-5
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.99
  gradient_clipping_threshold: 1.0
  use_mixed_precision: true
  gradient_accumulation_steps: 2
  enable_torch_compile: false
  enable_sam: false
  sam_rho: 0.05

loss_weights:
  charbonnier: 1.0
  laplacian: 0.5
  color_tight: 0.1
  temporal_consistency: 0.0
  fft: 0.1

logging_settings:
  log_interval: 512
  checkpoint_save_interval: 1
  validation_interval: 1
  num_vmaf_samples: 10
  empty_cuda_cache_on_validation: true

memory_settings:
  max_ram_ratio: 0.3       # 进程 RSS / 总系统 RAM 上限比例
  max_vram_ratio: 0.5      # torch.cuda.memory_allocated / total 上限比例
  check_interval: 256      # 每 N batch 检查一次

inference_settings:
  use_half_precision: true
