output_directory: runs/mamba
random_seed: 42

dataset:
  dataset_paths: [
             ./data/datasets/realisvideo-4k
    ]
  patch_size: 256
  num_frames: 5
  sequential_mode: true
  validation_batch_size: 2
  num_workers: 2
  validation_num_workers: 2
  warm_cache_on_startup: true
  max_videos_in_cache: 1
  shuffle_variants: true
  clip_repeat_factor: 1

model_architecture:
  model_name: mamba_fixer
  num_features: 64
  state_dimension: 32
  num_features_stream: 2
  num_experts: 42
  dilation_rates: [1, 2, 4, 32]

training_settings:
  batch_size: 4
  num_epochs: 20
  learning_rate: 2.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.99
  gradient_clipping_threshold: 1.0
  use_mixed_precision: true
  gradient_accumulation_steps: 2
  enable_torch_compile: false
  enable_sam: true
  sam_rho: 0.05

loss_weights:
  charbonnier: 1.0
  laplacian: 0.5
  color_tight: 0.3
  temporal_consistency: 0.0

logging_settings:
  checkpoint_save_interval: 1
  validation_interval: 1
  num_vmaf_samples: 10
  empty_cuda_cache_on_validation: false

inference_settings:
  use_half_precision: true
