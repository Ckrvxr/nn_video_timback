output_directory: runs/test
random_seed: 42

dataset:
  mirror: true
  num_workers: 4
  dataset_paths:
    - ./datasets/synthetic
    - ./datasets/kpop/newjeans_attention
  val_dataset_paths:
    - ./datasets/val/alysa_liu_stateside_025x
    - ./datasets/val/death_stranding
    - ./datasets/val/newjeans_attention
  validation_batch_size: 2

model_architecture:
  model_name: ArtRT
  dim: 48
  n1: 6
  n2: 8
  n3: 4
  nmid: 4
  compile: default

training_settings:
  batch_size: 4
  num_epochs: 5
  optimizer: prodigy
  prodigy:
    lr: 0.5
    weight_decay: 1.0e-4
    gradient_clipping_threshold: 5.0
    gradient_accumulation_steps: 1
    betas: [0.9, 0.999]
    beta3: 0.99
    d0: 1.0e-6
    safeguard_warmup: true
  adamw:
    lr: 1.0e-4
    weight_decay: 1.0e-4
    gradient_clipping_threshold: 5.0
    gradient_accumulation_steps: 1
    betas: [0.9, 0.95]
  sophia:
    lr: 1.0e-4
    weight_decay: 1.0e-1
    gradient_clipping_threshold: 5.0
    gradient_accumulation_steps: 1
    betas: [0.9, 0.95]
    rho: 0.04
    hessian_update_freq: 10

schedule:
  - epoch: 0
    weights:
      charbonnier: 0.9
      fft: 0.05
      fbin: 0.05


logging_settings:
  log_interval: 50
  validation_interval: 1
