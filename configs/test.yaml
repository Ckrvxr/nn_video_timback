output_directory: runs/testrun
random_seed: 42

dataset:
  data_type: raw
  dataset_paths:
    - ./dataset/game/death_stranding
    - ./datasets/cantoon/monsters_university
    - ./datasets/kpop/newjeans_attention
  val_dataset_paths:
    - ./datasets/val/alysa_liu_stateside_025x
    - ./datasets/val/death_stranding
    - ./datasets/val/newjeans_attention
  data_type: raw
  patch_size: 512
  num_frames: 9
  sequential_mode: true
  validation_batch_size: 2
  num_workers: 2
  validation_num_workers: 2
  shuffle_variants: true
  segment_repeat: 1

model_architecture:
  model_name: timback
  num_features: 64
  state_dimension: 32
  num_features_stream: 2
  num_experts: 42
  n_active: 3
  dilation_rates: [1, 3, 4]
  routing_threshold: 0.9

training_settings:
  batch_size: 10
  num_epochs: 100
  learning_rate: 5.0e-5
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.99
  gradient_clipping_threshold: 1.0
  use_mixed_precision: true
  gradient_accumulation_steps: 1
  enable_torch_compile: false
  enable_sam: false
  sam_rho: 0.05

loss_weights:
  charbonnier: 1.0
  rgb: 0.1
  gmsd: 0.1
  haarpsi: 0.45
  fft: 0.1
  ms_ssim: 0.1
  temporal_consistency: 0.0

logging_settings:
  log_interval: 1000
  checkpoint_save_interval: 1
  validation_interval: 1
  num_vmaf_samples: 100
  empty_cuda_cache_on_validation: true

memory_settings:
  max_ram_ratio: 0.3
  max_vram_ratio: 0.5
  check_interval: 512

inference_settings:
  use_half_precision: true
