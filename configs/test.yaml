output_directory: runs/test
random_seed: 42

dataset:
  dataset_paths:
    - ./datasets/synthetic
    - ./datasets/kpop/newjeans_attention
  val_dataset_paths:
    - ./datasets/val/alysa_liu_stateside_025x
    - ./datasets/val/death_stranding
    - ./datasets/val/newjeans_attention
  validation_batch_size: 2

model_architecture:
  model_name: ArtRT_R2_Test
  d_model: 48
  d_state: 32

training_settings:
  batch_size: 4
  num_epochs: 5
  lr:
    warmup_peak: 2.0e-4
    warmup_epochs: 1
    true_peak: 1.0e-4
    min: 1.0e-6
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.95
  gradient_clipping_threshold: 5.0
  gradient_accumulation_steps: 1

schedule:
  - epoch: 0
    weights:
      charbonnier: 1.0
      rgb: 0.1
      haarpsi: 0.5

logging_settings:
  log_interval: 50
  validation_interval: 1

memory_settings:
  max_ram_ratio: 0.5
  max_vram_ratio: 0.8
  check_interval: 256
