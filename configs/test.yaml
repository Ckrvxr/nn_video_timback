---
# Test config — 2 epochs, inherits all settings from prod.yaml
project_name: av1_vsr
output_dir: runs/test
seed: 42

data:
  datasets: [./data/datasets/realisvideo-4k,
             ./data/datasets/Takopii-no-Genzai,
             ./data/datasets/test_clip,]
  patch_size: 256
  frames: 5
  val_batch_size: 16
  workers: 0
  data_type: compressed
  scales: [1]

model:
  name: hyper_fixer
  n_features: 48
  n_blocks: 2
  latent: 512

training:
  batch_size: 32
  epochs: 2
  lr: 2.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  beta1: 0.9
  beta2: 0.99
  clip_grad: 1.0
  amp: true

loss:
  charbonnier: 1.0
  sobel_gradient: 0.03
  laplacian: 0.02
  ms_ssim: 0.1
  gaussian_soft_histogram: 0.01
  total_variation: 0.001
  temporal_consistency: 0.1

logging:
  log_interval: 50
  save_interval: 5
  val_interval: 1
  use_wandb: false
  wandb_project: av1-vsr

inference:
  tile_size: 1024
  overlap: 64
  fp16: true
