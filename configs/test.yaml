output_directory: runs/test
random_seed: 42

dataset:
  mirror: true
  dataset_paths:
    - ./datasets/synthetic
    - ./datasets/kpop/newjeans_attention
  val_dataset_paths:
    - ./datasets/val/alysa_liu_stateside_025x
    - ./datasets/val/death_stranding
    - ./datasets/val/newjeans_attention
  validation_batch_size: 2

model_architecture:
  model_name: ArtRT
  dim: 48
  n1: 2
  n2: 6
  n3: 8
  nmid: 12
  compile: default

training_settings:
  batch_size: 4
  num_epochs: 5
  lr:
    peak: 1.0e-4
    min: 1.0e-6
    period: 5
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.95
  gradient_clipping_threshold: 5.0
  gradient_accumulation_steps: 1

schedule:
  - epoch: 0
    weights:
      charbonnier: 1.0
      fft: 0.2
      # haarpsi: 5.0

logging_settings:
  log_interval: 50
  validation_interval: 1
