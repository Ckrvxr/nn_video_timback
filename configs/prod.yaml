output_directory: runs/prod
random_seed: 42

dataset:
  data_type: raw
  dataset_paths:
    - ./datasets/synthetic
    - ./datasets/cantoon/monsters_university
    - ./datasets/game/death_stranding
    - ./datasets/kpop/le_sserafim_antifragile
    - ./datasets/kpop/newjeans_attention
    - ./datasets/movie/john_wick_05x
    - ./datasets/sport/alysa_liu_stateside_025x
    - ./datasets/sport/alysa_liu_stateside_1x
  val_dataset_paths:
    - ./datasets/val/alysa_liu_stateside_025x
    - ./datasets/val/death_stranding
    - ./datasets/val/newjeans_attention
  patch_size: 512
  num_frames: 3
  sequential_mode: true
  validation_batch_size: 2
  num_workers: 4
  validation_num_workers: 2
  shuffle_variants: true
  segment_repeat: 2
  max_cached_segments: 8

model_architecture:
  model_name: pure_cnn
  base_ch: 32

training_settings:
  batch_size: 8
  num_epochs: 100
  lr:
    warmup_peak: 2.0e-4
    warmup_epochs: 1
    true_peak: 5.0e-5
    min: 1.0e-6
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.95
  gradient_accumulation_steps: 2
  gradient_clipping_threshold: 5.0
  use_mixed_precision: true
  enable_torch_compile: false
schedule:
  - epoch: 1-5
    weights:
      # sobel: 0.5
      # haarpsi: 0.1
      # fft: 0.1
      # ms_ssim: 0.01
      # temporal_consistency: 0.0
      charbonnier: 5.0
      rgb: 0.5
  - epoch: 6+
    weights:
      charbonnier: 5.0
      gmsd: 0.2
      rgb: 0.5

logging_settings:
  log_interval: 100
  checkpoint_save_interval: 1
  validation_interval: 1
  num_vmaf_samples: 30
  empty_cuda_cache_on_validation: true
  cuda_cache_interval: 100

memory_settings:
  max_ram_ratio: 0.25
  max_vram_ratio: 0.45
  check_interval: 256
  enable_dynamic_batch: true
  aggressive_cleanup: true

inference_settings:
  use_half_precision: true
