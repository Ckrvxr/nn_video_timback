output_directory: runs/prod
random_seed: 42

dataset:
  data_type: raw
  dataset_paths:
    - ./datasets/synthetic
    - ./datasets/cantoon/monsters_university
    - ./datasets/game/death_stranding
    - ./datasets/kpop/le_sserafim_antifragile
    - ./datasets/kpop/newjeans_attention
    - ./datasets/movie/john_wick_05x
    - ./datasets/sport/alysa_liu_stateside_025x
    - ./datasets/sport/alysa_liu_stateside_1x
  val_dataset_paths:
    - ./datasets/val/alysa_liu_stateside_025x
    - ./datasets/val/death_stranding
    - ./datasets/val/newjeans_attention
  patch_size: 512
  num_frames: 9
  sequential_mode: true
  validation_batch_size: 2
  num_workers: 4
  validation_num_workers: 2
  shuffle_variants: true
  segment_repeat: 2
  max_cached_segments: 4

model_architecture:
  model_name: timback
  num_features: 64
  state_dimension: 32
  num_features_stream: 2
  num_experts: 42
  n_active: 3
  dilation_rates: [1, 3, 4]
  routing_threshold: 0.9

training_settings:
  batch_size: 8
  num_epochs: 100
  lr:
    warmup_peak: 2.0e-4
    warmup_epochs: 1
    true_peak: 5.0e-5
    min: 1.0e-6
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.99
  gradient_accumulation_steps: 2
  gradient_clipping_threshold: 1.0
  enable_sam: false
  sam_rho: 0.05
  use_mixed_precision: true
  enable_torch_compile: false
schedule:
  - epoch: 1
    weights:
      ms_ssim: 0.0
      gmsd: 0.0
      haarpsi: 0.0
      fft: 0.0
      rgb: 10.0
      charbonnier: 10.0
      temporal_consistency: 0.0
      moe: 3.0
  - epoch: 1+
    weights:
      ms_ssim: 0.1 
      gmsd: 1.0
      haarpsi: 1.0
      fft: 1.0
      rgb: 0.05
      charbonnier: 0.05
      temporal_consistency: 0.0
      moe: 3.0


logging_settings:
  log_interval: 500
  checkpoint_save_interval: 1
  validation_interval: 1
  num_vmaf_samples: 30
  empty_cuda_cache_on_validation: true
  cuda_cache_interval: 100  # 更频繁的CUDA缓存清理

memory_settings:
  max_ram_ratio: 0.25       # 进程 RSS / 总系统 RAM 上限比例 (16GB RAM -> 4GB max)
  max_vram_ratio: 0.45      # torch.cuda.memory_allocated / total 上限比例 (7GB VRAM -> 3.15GB max)
  check_interval: 256       # 每 N batch 检查一次 (更频繁的检查)
  enable_dynamic_batch: true # 启用动态批次大小调整
  aggressive_cleanup: true  # 启用激进的内存清理

inference_settings:
  use_half_precision: true
