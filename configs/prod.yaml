output_directory: runs/prod
random_seed: 42

dataset:
  data_type: preprocessed
  dataset_paths:
    - ./data/catchme
    - ./data/hyouka04
    - ./data/it2017
    - ./data/the_long_season_1
    - ./data/violet
    - ./data/death_stranding
    - ./data/newjeans_attention
    - ./data/monsters_university
    - ./data/takopii_01
  val_dataset_paths:
    - ./data/catchme_val
    - ./data/hyouka04_val
    - ./data/it2017_val
    - ./data/the_long_season_1_val
    - ./data/violet_val
    - ./data/death_stranding_val
    - ./data/newjeans_attention_val
    - ./data/monsters_university_val
    - ./data/takopii_01_val
  patch_size: 512
  num_frames: 9
  sequential_mode: true
  validation_batch_size: 2
  num_workers: 1
  validation_num_workers: 0
  shuffle_variants: true
  clip_repeat_factor: 1

model_architecture:
  model_name: mamba_fixer
  num_features: 64
  state_dimension: 32
  num_features_stream: 2
  num_experts: 42
  n_active: 3
  dilation_rates: [1, 3, 4]
  routing_threshold: 0.9

training_settings:
  batch_size: 11
  num_epochs: 100
  lr:
    warmup_peak: 2.0e-4
    warmup_epochs: 1
    true_peak: 5.0e-5
    min: 1.0e-6
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.99
  gradient_accumulation_steps: 10
  gradient_clipping_threshold: 1.0
  enable_sam: false
  sam_rho: 0.05
  use_mixed_precision: true
  enable_torch_compile: false
schedule:
  - epoch: 1
    weights:
      ms_ssim: 0.0
      wavelet: 0.0
      fft: 0.0
      sobel: 0.4
      rgb: 0.5
      charbonnier: 1.0
      moe: 0.01
  - epoch: 2-3
    weights:
      ms_ssim: 0.0
      wavelet: 5.0
      fft: 1.0
      sobel: 0.5
      rgb: 0.10
      charbonnier: 0.05
      temporal_consistency: 0.0
      moe: 0.01
  - epoch: 4+
    weights:
      ms_ssim: 1.0
      wavelet: 0.5
      fft: 0.3
      sobel: 0.15
      rgb: 0.10
      charbonnier: 0.05
      temporal_consistency: 0.0
      moe: 0.01


logging_settings:
  log_interval: 1000
  checkpoint_save_interval: 1
  validation_interval: 1
  num_vmaf_samples: 100
  empty_cuda_cache_on_validation: true

memory_settings:
  max_ram_ratio: 0.3       # 进程 RSS / 总系统 RAM 上限比例
  max_vram_ratio: 0.5      # torch.cuda.memory_allocated / total 上限比例
  check_interval: 512      # 每 N batch 检查一次

inference_settings:
  use_half_precision: true
