---
project_name: av1_vsr
output_dir: runs/prod
seed: 42

data:
  datasets: [
             ./data/datasets/realisvideo-4k
    ]
  patch_size: 512
  frames: 5
  val_batch_size: 2
  workers: 1
  val_workers: 1
  data_type: compressed
  warm_cache: true
  cache_max_videos: 2
  prefetch_factor: 1
  shuffle_variants: true
  clip_repeat: 1

model:
  name: hyper_fixer
  n_features: 48
  n_blocks: 2
  latent: 256

training:
  batch_size: 2
  epochs: 100
  lr: 2.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  beta1: 0.9
  beta2: 0.99
  clip_grad: 1.0
  amp: true
  gradient_accumulation_steps: 16
  compile: false

loss:
  charbonnier: 1.0
  ms_ssim: 0.1
  laplacian: 0.02
  temporal_consistency: 0.02

  # gaussian_soft_histogram: 0.01
  # sobel_gradient: 0.01
  # total_variation: 0.01


logging:
  log_interval: 50
  save_interval: 1
  val_interval: 1
  empty_cuda_cache: true
  use_wandb: false
  wandb_project: av1-vsr

inference:
  tile_size: 1024
  overlap: 64
  fp16: true
