---
project_name: av1_vsr
output_dir: runs/prod
seed: 42

data:
  datasets: [./data/datasets/Takopii-no-Genzai, ./data/datasets/realisvideo-4k]
  patch_size: 512
  frames: 5
  val_batch_size: 2
  workers: 2
  val_workers: 1
  data_type: compressed
  warm_cache: true
  cache_max_videos: 4
  prefetch_factor: 2
  shuffle_variants: false
  clip_repeat: 1

model:
  name: hyper_fixer
  n_features: 48
  n_blocks: 2
  latent: 256

training:
  batch_size: 32
  epochs: 100
  lr: 2.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  beta1: 0.9
  beta2: 0.99
  clip_grad: 1.0
  amp: true
  gradient_accumulation_steps: 1
  compile: false

loss:
  # ──────────────────────────────────────────────
  # 1. Overall Reconstruction — 像素级重建保真度
  # ──────────────────────────────────────────────
  charbonnier: 1.0

  # ──────────────────────────────────────────────
  # 2. Edge Blurring — AV1 低码率高频丢失, 边缘变糊
  #    Sobel: 显式惩罚边缘梯度偏差
  #    MS-SSIM: 保持局部结构/对比度
  # ──────────────────────────────────────────────
  sobel_gradient: 0.03
  ms_ssim: 0.1

  # ──────────────────────────────────────────────
  # 3. Banding / Contouring — 平滑渐变量化断层
  #    Laplacian: 捕捉二阶微分(色带等于一阶平坦但二阶突变)
  # ──────────────────────────────────────────────
  laplacian: 0.02

  # ──────────────────────────────────────────────
  # 4. Color Shift / Chroma Bleeding — 色度量化偏移
  #    Gaussian Soft Histogram: 全通道分布匹配
  # ──────────────────────────────────────────────
  gaussian_soft_histogram: 0.01

  # ──────────────────────────────────────────────
  # 5. Quantization Noise — 平坦区颗粒噪声
  #    Total Variation: 平滑先验, 抑制高频噪点
  # ──────────────────────────────────────────────
  total_variation: 0.001

  # ──────────────────────────────────────────────
  # 6. Temporal Flickering — 帧间量化不一致导致的闪烁
  # ──────────────────────────────────────────────
  temporal_consistency: 0.1

logging:
  log_interval: 50
  save_interval: 1
  val_interval: 1
  empty_cuda_cache: true
  use_wandb: false
  wandb_project: av1-vsr

inference:
  tile_size: 1024
  overlap: 64
  fp16: true
