output_directory: runs/prod
random_seed: 42

dataset:
  dataset_paths: [
             ./data/datasets/realisvideo-4k
    ]
  patch_size: 512
  num_frames: 5
  validation_batch_size: 2
  num_workers: 2
  validation_num_workers: 2
  shuffle_variants: true
  clip_repeat_factor: 1

model_architecture:
  model_name: hyper_fixer
  num_features: 48
  num_blocks: 2
  latent_dimension: 256

training_settings:
  batch_size: 2
  num_epochs: 100
  learning_rate: 2.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.99
  gradient_clipping_threshold: 1.0
  use_mixed_precision: true
  gradient_accumulation_steps: 16
  enable_torch_compile: false

loss_weights:
  charbonnier: 1.0
  ms_ssim: 0.1
  laplacian: 0.02
  temporal_consistency: 0.02

logging_settings:
  log_interval: 50
  checkpoint_save_interval: 1
  validation_interval: 1
  empty_cuda_cache_on_validation: false

inference_settings:
  tile_size: 1024
  tile_overlap: 64
  use_half_precision: true
