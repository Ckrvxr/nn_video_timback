output_directory: runs/production
random_seed: 42

dataset:
  mirror: true
  dataset_paths:
    - ./datasets/synthetic
    - ./datasets/cantoon/monsters_university
    - ./datasets/game/death_stranding/
    - ./datasets/kpop/le_sserafim_antifragile
    - ./datasets/kpop/newjeans_attention
    - ./datasets/movie/john_wick_05x/
    - ./datasets/sport/alysa_liu_stateside_1x/
    - ./datasets/sport/alysa_liu_stateside_025x/
  val_dataset_paths:
    - ./datasets/val/alysa_liu_stateside_025x
    - ./datasets/val/death_stranding
    - ./datasets/val/newjeans_attention
  validation_batch_size: 5

model_architecture:
  model_name: ArtRT
  dim: 48
  n1: 6
  n2: 8
  n3: 4
  nmid: 4
  compile: default

training_settings:
  batch_size: 8
  num_epochs: 100
  lr:
    peak: 5.0e-5
    min: 1.0e-6
    period: 30
  weight_decay: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  gradient_clipping_threshold: 1.0
  gradient_accumulation_steps: 2

schedule:
  - epoch: 1+
    weights:
      charbonnier: 0.999
      fft: 0.001
      # haarpsi: 5.0


logging_settings:
  log_interval: 100
  validation_interval: 1
